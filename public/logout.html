<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logging out…</title>
  <style>
    body {font-family: system-ui, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; background:#0a0a1a; color:#fff;}
  </style>
</head>
<body>
  <p>Logging you out…</p>
  <script>
    // Clear all auth related storage
    try { localStorage.removeItem('loggedInUser'); } catch(e) {}
    try { localStorage.removeItem('loggedInUserData'); } catch(e) {}
    // Optionally clear any custom session keys
    try { localStorage.clear(); } catch(e) {}
    // Redirect to home after a short delay
    setTimeout(() => { window.location.href = '../index.html'; }, 500);
  </script>
</body>
</html>
